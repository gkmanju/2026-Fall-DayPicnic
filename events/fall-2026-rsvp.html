<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RSVP | 2026 Fall Day Picnic</title>

    <linkyles.css
</head>

<body>

<header class="header">
    <h1>✅ RSVP Interest</h1>
    <p>Namma Folsom Fall Day Picnic 2026</p>
</header>

<main class="content">

    <section class="event-card">

        <h2>Event Details</h2>

        <p><strong>Date:</strong> Saturday, September 12, 2026</p>

        <p><strong>Venue:</strong> To Be Announced</p>

        <p>
            This RSVP helps us estimate attendance while
            finalizing the venue and event logistics.
        </p>

    </section>

    <section class="event-card">

        <h2>RSVP Form</h2>

        <form>

            <p>
                <label>
                    Family Name<br>
                    <input type="text" name="familyName" size="40">
                </label>
            </p>

            <p>
                <label>
                    Email Address<br>
                    <input type="email" name="email" size="40">
                </label>
            </p>

            <p>
                <label>
                    Number of Adults<br>
                    <input type="number" min="0" value="2">
                </label>
            </p>

            <p>
                <label>
                    Number of Children<br>
                    <input type="number" min="0" value="0">
                </label>
            </p>

            <p>
                Preferred Venue
            </p>

            <label>
                <input type="radio" name="venue" value="us50">
                US‑50 East Corridor
            </label>

            <br>

            <label>
                <input type="radio" name="venue" value="delta">
                Delta Area
            </label>

            <br><br>

            <label>
                Comments<br>
                <textarea rows="5" cols="50"></textarea>
            </label>

            <br><br>

            <button type="button">
                RSVP Coming Soon
            </button>

        </form>

    </section>

</main>

</body>
</html>
